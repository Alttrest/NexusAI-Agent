<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .grid-bg { fill: url(#grid); }
    .pulse-elem { animation: pulse 2.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="560" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="560" rx="16" class="grid-bg" />

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect width="200" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#38bdf8" />
    <text x="28" y="17" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">LOCAL AI OPERATOR</text>
  </g>

  <!-- Left Column: Project Identity & Specs -->
  <g transform="translate(60, 115)">
    <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">NexusAI-Agent</text>
    <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Futuristic Desktop AI Operator with Monaco IDE &amp; Floating Pet</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 100)">
      
        <rect x="0" y="0" width="96" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="48" y="19" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">Electron</text>
        
        <rect x="108" y="0" width="96" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="156" y="19" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="12" font-weight="600">React 18</text>
        
        <rect x="216" y="0" width="114" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="273" y="19" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12" font-weight="600">TypeScript</text>
        
        <rect x="342" y="0" width="141" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="412" y="19" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="600">Monaco Editor</text>
        
    </g>

    <!-- Metrics Cards -->
    <g transform="translate(0, 160)">
      
        <g transform="translate(0, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">WORKSPACE</text>
          <text x="14" y="48" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Chat / Code / Studio</text>
        </g>
        
        <g transform="translate(155, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">COMPANION</text>
          <text x="14" y="48" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Desktop Pet</text>
        </g>
        
        <g transform="translate(310, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">EXECUTION</text>
          <text x="14" y="48" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">OpenRouter AI</text>
        </g>
        
    </g>

    <!-- Detailed Highlights -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">CORE SYSTEM ARCHITECTURE:</text>
      
        <text x="0" y="22" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Local desktop orchestration with specialized system tools</text>
        
        <text x="0" y="42" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Integrated Monaco Editor for streaming code generation an...</text>
        
        <text x="0" y="62" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Interactive floating desktop pet companion with dynamic r...</text>
        
    </g>
  </g>

  <!-- Right Column: Bespoke Visual Representation -->
  <g transform="translate(680, 50)">
    
        <g transform="translate(20, 20)">
          <!-- Window Frame -->
          <rect width="420" height="310" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
          <path d="M 0 8 C 0 3.5 3.5 0 8 0 L 412 0 C 416.5 0 420 3.5 420 8 L 420 28 L 0 28 Z" fill="#0f172a"/>
          <circle cx="16" cy="14" r="3.5" fill="#ef4444"/>
          <circle cx="28" cy="14" r="3.5" fill="#f59e0b"/>
          <circle cx="40" cy="14" r="3.5" fill="#10b981"/>
          <text x="60" y="18" fill="#94a3b8" font-family="monospace" font-size="10">NexusAI Shell [Agentic Runtime]</text>

          <g transform="translate(15, 45)">
            <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10">01</text>
            <text x="25" y="16" fill="#f43f5e" font-family="monospace" font-size="10">import</text>
            <text x="70" y="16" fill="#f1f5f9" font-family="monospace" font-size="10">{ Agent, ToolRunner } from</text>
            <text x="230" y="16" fill="#38bdf8" font-family="monospace" font-size="10">'@nexus/core'</text>

            <text x="0" y="38" fill="#64748b" font-family="monospace" font-size="10">02</text>
            <text x="25" y="38" fill="#f43f5e" font-family="monospace" font-size="10">const</text>
            <text x="65" y="38" fill="#38bdf8" font-family="monospace" font-size="10">operator</text>
            <text x="125" y="38" fill="#f1f5f9" font-family="monospace" font-size="10">= new Agent({</text>

            <text x="0" y="60" fill="#64748b" font-family="monospace" font-size="10">03</text>
            <text x="40" y="60" fill="#cbd5e1" font-family="monospace" font-size="10">mode: 'system_operator',</text>

            <text x="0" y="82" fill="#64748b" font-family="monospace" font-size="10">04</text>
            <text x="40" y="82" fill="#cbd5e1" font-family="monospace" font-size="10">tools: [FileSystem, Process, NetLens]</text>

            <text x="0" y="104" fill="#64748b" font-family="monospace" font-size="10">05</text>
            <text x="25" y="104" fill="#f1f5f9" font-family="monospace" font-size="10">});</text>
          </g>

          <!-- Floating Pet Orb -->
          <g transform="translate(320, 210)" class="pulse-elem">
            <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
            <rect x="-16" y="-8" width="12" height="6" rx="3" fill="#38bdf8"/>
            <rect x="4" y="-8" width="12" height="6" rx="3" fill="#38bdf8"/>
            <path d="M -8 10 Q 0 16 8 10" stroke="#38bdf8" stroke-width="2" fill="none"/>
          </g>
        </g>
        
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 515)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="22" fill="#64748b" font-family="monospace" font-size="11">REPOSITORY: Alttrest/NexusAI-Agent</text>
    <text x="400" y="22" fill="#64748b" font-family="monospace" font-size="11">MAINTAINER: Ali Turan (@Alttrest)</text>
    <text x="960" y="22" fill="#38bdf8" font-family="monospace" font-size="11">● PRODUCTION VERIFIED</text>
  </g>
</svg>